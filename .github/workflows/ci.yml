name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rust:
    name: Rust Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify precomputed skill manifest sync
        if: runner.os == 'Linux'
        run: |
          manifest_count=$(grep -o '"count":[[:space:]]*[0-9]*' src/ml/precomputed_manifest.json | head -n1 | grep -o '[0-9]*' || echo "0")
          skill_count=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "Manifest skill count: ${manifest_count}, Workspace skills/: ${skill_count}"
          if [ "${manifest_count}" != "${skill_count}" ]; then
            echo "::error::Precomputed skill vectors (${manifest_count}) differ from skills/ directory count (${skill_count}). Run --reindex-skills before merging."
            exit 1
          fi

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo test
        run: cargo test --bin agent-guidance -- --nocapture

  test-npm:
    name: NPM Package Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run NPM tests
        run: |
          npm test --prefix packaging/npm

  lint-scripts:
    name: Validate Scripts Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Shell scripts
        run: |
          bash -n scripts/*.sh

      - name: Validate Python scripts
        run: |
          python3 -m py_compile scripts/*.py
